name: BYOT
options:
  bundleIdPrefix: com.steventsao
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: 1.0.31
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: 449BD89VDV
packages:
  # Terminal emulator for the PTY screen. 1.10.1 is the newest release without
  # build-tool plugins or benchmark dependencies in its manifest; later ones need
  # plugin trust in command-line and archive builds.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.10.1
targets:
  BYOT:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: SwiftTerm
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: byot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: app.byot.pair
            CFBundleURLSchemes:
              - byot
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _http._tcp
        NSCameraUsageDescription: byot uses the camera only to scan the pairing code for your OpenCode server.
        NSLocalNetworkUsageDescription: byot finds OpenCode servers on your network and connects to the ones you add by local address.
        NSMicrophoneUsageDescription: byot listens only while you dictate a message, and only after you tap the microphone.
        NSSpeechRecognitionUsageDescription: byot turns what you dictate into message text. Speech is transcribed on this device when your language supports it; otherwise Apple transcribes it.
        UIAppFonts:
          - OpenRunde-Bold.otf
          - OpenRunde-Regular.otf
          - OpenRunde-Medium.otf
          - OpenRunde-Semibold.otf
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/BYOT.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.steventsao.byot
        PRODUCT_NAME: byot
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - BYOTTests
        - BYOTUITests
  BYOTTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - UITests
    dependencies:
      - target: BYOT
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.steventsao.byot.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/byot.app/byot"
  BYOTUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UITests
    dependencies:
      - target: BYOT
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.steventsao.byot.uitests
        TEST_TARGET_NAME: BYOT
