name: BYOT
options:
  bundleIdPrefix: com.steventsao
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: 1.0.31
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: 449BD89VDV
targets:
  BYOT:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
    dependencies:
      # Home-screen widget and Live Activity UI. Remove this entry (and the
      # App Group key in Sources/BYOT.entitlements) to ship without it; see
      # docs/releases/1.0.31-signing.md.
      - target: BYOTWidgets
      # Share-sheet entry that hands text, links, images and files to the
      # composer. Remove this entry to ship without it; see
      # docs/releases/1.0.31-signing.md.
      - target: BYOTShare
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: byot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        # Opened by the share extension with the id of a saved share only.
        CFBundleURLTypes:
          - CFBundleURLName: com.steventsao.byot.share
            CFBundleURLSchemes:
              - byot-share
        UIAppFonts:
          - OpenRunde-Bold.otf
          - OpenRunde-Regular.otf
          - OpenRunde-Medium.otf
          - OpenRunde-Semibold.otf
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/BYOT.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.steventsao.byot
        PRODUCT_NAME: byot
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - BYOTTests
        - BYOTUITests
  BYOTWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
      - path: Sources/BYOTBrand.swift
      - path: Sources/Resources/Fonts/OpenRunde-Bold.otf
        buildPhase: resources
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: byot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - OpenRunde-Bold.otf
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Widgets/BYOTWidgets.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.steventsao.byot.widgets
        PRODUCT_NAME: BYOTWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  BYOTShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - path: Shared/BYOTAppGroup.swift
      - path: Sources/BYOTBrand.swift
      - path: Sources/BYOTDesignSystem.swift
      - path: Sources/BYOTShareImport.swift
      - path: Sources/BYOTShareInbox.swift
      - path: Sources/OpenCodePromptAttachment.swift
      - path: Sources/Resources/Fonts/OpenRunde-Bold.otf
        buildPhase: resources
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: byot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).BYOTShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
        UIAppFonts:
          - OpenRunde-Bold.otf
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ShareExtension/BYOTShare.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.steventsao.byot.share
        PRODUCT_NAME: BYOTShare
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  BYOTTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - UITests
    dependencies:
      - target: BYOT
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.steventsao.byot.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/byot.app/byot"
  BYOTUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UITests
    dependencies:
      - target: BYOT
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.steventsao.byot.uitests
        TEST_TARGET_NAME: BYOT
