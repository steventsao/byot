      - path: ../Sources/OpenCodeWorktreeStore.swift
        group: Core
    dependencies:
      - package: SwiftTerm
      - package: PostHog
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: byot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        ATSApplicationFontsPath: "."
        CFBundleURLTypes:
          - CFBundleURLName: app.byot.pair
            CFBundleURLSchemes:
              - byot
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _http._tcp
        NSLocalNetworkUsageDescription: byot finds OpenCode servers on your network and connects to servers running on this Mac or over Tailscale.
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Resources/BYOTDesktop.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.steventsao.byot.desktop
        PRODUCT_NAME: byot
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
