name: BYOTDesktop
options:
  bundleIdPrefix: com.steventsao
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: 449BD89VDV
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -Osize
      DEAD_CODE_STRIPPING: YES
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      COPY_PHASE_STRIP: YES
packages:
  # Same pinned dependencies as the iOS target, both natively supporting macOS.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.10.1
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.89.0
targets:
  BYOTDesktop:
    type: application
    platform: macOS
    sources:
      # Desktop-only shell, AppKit bridges, and native macOS SwiftUI views.
      - path: Sources
      # macOS icon and assets.
      - path: Resources/Assets.xcassets
      # Only OpenRunde-Bold is used (strictly for the lowercase `byot` wordmark).
      - path: ../Sources/Resources/Fonts/OpenRunde-Bold.otf
        buildPhase: resources
      # Shared headless BYOT core (pure Foundation: OpenCode v1/v2 client,
      # transport, SSE streaming, stores, reducers, terminal/diff/worktree/file
      # engines, syntax highlighter, Keychain, pairing, telemetry).
      # Kept read-only from ../Sources so the iPhone target remains untouched.
      - path: ../Shared/BYOTWidgetLink.swift
        group: Core
      - path: ../Sources/BYOTDurableQueue.swift
        group: Core
      - path: ../Sources/BYOTNudge.swift
        group: Core
      - path: ../Sources/BYOTPushClient.swift
        group: Core
      - path: ../Sources/BYOTPushModels.swift
        group: Core
      - path: ../Sources/BYOTSyntaxHighlighter.swift
        group: Core
      - path: ../Sources/BYOTSyntaxLanguage.swift
        group: Core
      - path: ../Sources/BYOTTelemetry.swift
        group: Core
      - path: ../Sources/BYOTTelemetryOpenCode.swift
        group: Core
      - path: ../Sources/KeychainStore.swift
        group: Core
      - path: ../Sources/OpenCodeActions.swift
        group: Core
      - path: ../Sources/OpenCodeBonjourBrowser.swift
        group: Core
      - path: ../Sources/OpenCodeCapabilities.swift
        group: Core
      - path: ../Sources/OpenCodeClient.swift
        group: Core
      - path: ../Sources/OpenCodeCompatibility.swift
        group: Core
      - path: ../Sources/OpenCodeCompatibilitySummary.swift
        group: Core
      - path: ../Sources/OpenCodeComposerCatalog.swift
        group: Core
