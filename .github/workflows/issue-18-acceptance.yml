name: OpenCode cutover acceptance verification

on:
  push:
    branches:
      - codex/issue-18-cutover-validation

permissions:
  contents: read

jobs:
  dual-stack-contract:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n scripts/opencode-acceptance.sh scripts/test-opencode-acceptance.sh
      - name: Exercise v1 and v2 fixtures
        run: scripts/test-opencode-acceptance.sh
